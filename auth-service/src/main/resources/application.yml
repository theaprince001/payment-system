spring:
  application:
    name: auth-gateway
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  redis:
    spring. data. redis. host: ${REDIS_HOST:localhost}
    spring. data. redis. port: 6379
    spring. data. redis. password: ${REDIS_PASSWORD}
  cloud:
    gateway:
      routes:
        - id: auth-endpoints
          uri: http://localhost:${server.port}
          predicates:
            - Path=/api/auth/**
        - id: payment-orchestrator
          uri: http://localhost:8084
          predicates:
            - Path=/api/payments/**
        - id: ledger-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/ledger/**

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:my-256-bit-secret-key}
  expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:production}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html